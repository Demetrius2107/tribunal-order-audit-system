server:
  port: 8080

spring:
  application:
    name: tribunal-order-audit-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 请按本机 MySQL 配置修改
    url: jdbc:mysql://localhost:3306/order_group?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id            # 雪花 ID（对照旧项目 IdWorkerUtil）
      logic-delete-field: deleted   # 逻辑删除字段（对照旧项目 deleted_at 习惯）
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.order.group: debug
