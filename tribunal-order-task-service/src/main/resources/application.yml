server:
  port: 8088

spring:
  application:
    name: tribunal-order-task-service
  # M5: Nacos 服务发现（无 Nacos 环境时设为 false；启用后 Feign 服务名路由）
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 独立库：tribunal_task（定时任务域独立数据库）
    url: jdbc:mysql://localhost:3306/tribunal_task?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（本地解析 Token 鉴权；须与 auth-service 的 secret 一致）
jwt:
  secret: ${JWT_SECRET:tribunal-order-auth-secret-key-2026-0123456789abcdef}

# 鉴权配置
auth:
  # 服务间 Feign 调用互信令牌（各服务须一致）
  internal-token: ${AUTH_INTERNAL_TOKEN:tribunal-internal-token-2026}

# 订单服务地址（超时关单 Feign 调用）
order:
  service:
    url: ${ORDER_SERVICE_URL:http://localhost:8080}

# M5: Feign + Resilience4j 整合（熔断器按 Feign client name 分组）
feign:
  circuitbreaker:
    enabled: true

# M5: Resilience4j 熔断/降级配置
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - feign.FeignException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      tribunal-order-service:
        base-config: default

logging:
  level:
    com.demetrius.tribunal.task: debug
