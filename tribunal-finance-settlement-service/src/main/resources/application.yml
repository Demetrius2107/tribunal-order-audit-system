server:
  port: 8091

spring:
  application:
    name: tribunal-finance-settlement-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 独立库：tribunal_finance_settlement（金融结算系统独立数据库，对照 sql/finance_settlement.sql）
    url: jdbc:mysql://localhost:3306/tribunal_finance_settlement?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.demetrius.tribunal.financesettlement: debug
