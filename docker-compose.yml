# =============================================================================
# 订单审单系统 — 中间件一键编排（M5 微服务治理依赖）
#
# 使用方式：
#   docker-compose up -d
#
# 服务清单：
#   MySQL     :3306   — 所有微服务共享实例，按 schema 分库
#   Nacos     :8848   — 服务发现 + 配置中心（standalone 模式）
#   Redis     :6379   — 分布式幂等 + 登录失败锁定 + RefreshToken 存储
#   Kafka     :9092   — 领域事件总线（KRaft 模式，无需 Zookeeper）
#
# 验证：
#   Nacos 控制台: http://localhost:8848/nacos (账号/密码 nacos/nacos)
#   Redis:        docker exec -it tribunal-redis redis-cli ping
#   Kafka Topic:  docker exec tribunal-kafka /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092
# =============================================================================
version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0 — 初始化脚本自动执行 docs/sql/*.sql
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: tribunal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - tribunal-mysql-data:/var/lib/mysql
      - ./docs/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Nacos 2.3 — 服务发现 + 配置中心（standalone，内嵌 derby）
  # ---------------------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: tribunal-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "TribunalNacosSecretKey2026ForJwtSigning0123456789"
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
    ports:
      - "8848:8848"
      - "9848:9848"   # gRPC 端口（Nacos 2.x 客户端必须）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis 7 — 分布式幂等 / 登录失败锁定 / RefreshToken
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tribunal-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - tribunal-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Kafka 3.6 (KRaft 模式，无需 Zookeeper) — 领域事件总线
  # ---------------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.6
    container_name: tribunal-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # 内部/外部统一端口
    environment:
      # KRaft 模式配置
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 单节点允许的 topic 副本数
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - tribunal-kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # Prometheus — 指标采集（M6 可观测性）
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: tribunal-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus-alert-rules.yml:/etc/prometheus/alert_rules/alert-rules.yml
      - tribunal-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Grafana — 指标可视化看板（M6 可观测性）
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: tribunal-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - tribunal-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  tribunal-mysql-data:
  tribunal-redis-data:
  tribunal-kafka-data:
  tribunal-prometheus-data:
  tribunal-grafana-data:
