server:
  port: 8080

spring:
  application:
    name: tribunal-order-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 独立库：tribunal_order（微服务独立数据库，对照 schema.sql）
    url: jdbc:mysql://localhost:3306/tribunal_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# customer-service 地址（Feign 直连；接入 Nacos 后可去掉 url 用服务名路由）
customer:
  service:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}

# 金融账单服务地址（转单 Feign 调用）
billing:
  service:
    url: ${BILLING_SERVICE_URL:http://localhost:8082}

# 库存物料服务地址（库存预占/释放 Feign 调用）
inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8083}

# 营销价格服务地址（取价 Feign 调用）
marketing:
  service:
    url: ${MARKETING_SERVICE_URL:http://localhost:8084}

# 履约执行服务地址（创建履约 Feign 调用）
fulfillment:
  service:
    url: ${FULFILLMENT_SERVICE_URL:http://localhost:8085}

# 通知服务地址（发送通知 Feign 调用）
notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（本地解析 Token 鉴权；须与 auth-service 的 secret 一致）
jwt:
  secret: ${JWT_SECRET:tribunal-order-auth-secret-key-2026-0123456789abcdef}

# 鉴权配置
auth:
  # 服务间 Feign 调用互信令牌（各服务须一致）
  internal-token: ${AUTH_INTERNAL_TOKEN:tribunal-internal-token-2026}

logging:
  level:
    com.demetrius.tribunal.order: debug
