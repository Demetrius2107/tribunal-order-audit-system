# =============================================================================
# Prometheus 告警规则（M6 告警闭环）
#
# 覆盖四类核心告警：
#   1. 服务可用性（up）           —— 服务宕机
#   2. HTTP 错误率（5xx 占比）    —— 接口大面积失败
#   3. HTTP 响应时间（P95）       —— 接口变慢
#   4. JVM 堆内存 / Kafka 消费积压 —— 资源与消息堆积
#
# 说明：Prometheus 通过 rule_files 加载本文件（prometheus.yml 已配置）。
#       无 Alertmanager 时告警在 Prometheus 界面 Alerts 页可见；接入 Alertmanager 后可推送通知。
# =============================================================================

groups:
  - name: service-health
    rules:
      # 1. 服务不可用：任意采集目标 up == 0 持续 1 分钟
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务不可用 {{ $labels.job }}"
          description: "{{ $labels.job }} ({{ $labels.instance }}) 已停止响应超过 1 分钟"

      # 2. HTTP 5xx 错误率：近 5 分钟 5xx 占比 > 5% 持续 5 分钟
      - alert: HighHttpErrorRate
        expr: |
          (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (service))
          / (sum(rate(http_server_requests_seconds_count[5m])) by (service)) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} 5xx 错误率过高"
          description: "{{ $labels.service }} 近 5 分钟 5xx 占比 {{ $value | humanizePercentage }}"

      # 3. HTTP 响应时间：P95 超过 2s 持续 5 分钟
      - alert: SlowHttpResponse
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} 响应变慢"
          description: "{{ $labels.service }} P95 响应时间 {{ $value }}s 超过 2s"

  - name: resource-health
    rules:
      # 4. JVM 堆内存：使用率 > 90% 持续 5 分钟
      - alert: JvmHeapHigh
        expr: |
          jvm_memory_used_bytes{area="heap"}
          / jvm_memory_max_bytes{area="heap"} > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} JVM 堆内存过高"
          description: "{{ $labels.job }} 堆内存使用率 {{ $value | humanizePercentage }}"

      # 5. Kafka 消费积压：消费组 lag 超过阈值（指标名随 spring-kafka 版本略有差异）
      - alert: KafkaConsumerLagHigh
        expr: |
          max(kafka_consumer_fetch_manager_records_lag) by (group_id) > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.group_id }} Kafka 消费积压"
          description: "消费组 {{ $labels.group_id }} lag 达 {{ $value }} 条，可能消费异常"
