server:
  port: 8080

spring:
  application:
    name: tribunal-order-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tribunal_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  # M5: Nacos 服务发现（无 Nacos 环境时设为 false，直连 url 模式仍可用）
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}
  # M5: Redis（分布式幂等/登录锁定；无 Redis 时降级到本地 ConcurrentHashMap）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0

# M3 异步化：本地消息表中继开关（测试/无 Kafka 环境可关闭）
tribunal:
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}

# M5: Resilience4j 熔断/降级配置
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - feign.FeignException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      customer-service:
        base-config: default
      marketing-service:
        base-config: default
  # M5: 限流（防止下游被压垮）
  ratelimiter:
    configs:
      default:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 5s
    instances:
      customer-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException

# M5: Feign + Resilience4j 整合（熔断器按 Feign client name 分组）
feign:
  circuitbreaker:
    enabled: true

# customer-service 地址（Feign 直连；接入 Nacos 后可去掉 url 用服务名路由）
customer:
  service:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}

# 金融账单服务地址（转单 Feign 调用）
billing:
  service:
    url: ${BILLING_SERVICE_URL:http://localhost:8082}

# 库存物料服务地址（库存预占/释放 Feign 调用）
inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8083}

# 营销价格服务地址（取价 Feign 调用）
marketing:
  service:
    url: ${MARKETING_SERVICE_URL:http://localhost:8084}

# 履约执行服务地址（创建履约 Feign 调用）
fulfillment:
  service:
    url: ${FULFILLMENT_SERVICE_URL:http://localhost:8085}

# 通知服务地址（发送通知 Feign 调用）
notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（本地解析 Token 鉴权；须与 auth-service 的 secret 一致）
jwt:
  secret: ${JWT_SECRET:tribunal-order-auth-secret-key-2026-0123456789abcdef}

# 鉴权配置
auth:
  # 服务间 Feign 调用互信令牌（各服务须一致）
  internal-token: ${AUTH_INTERNAL_TOKEN:tribunal-internal-token-2026}

# M6: Actuator 指标/健康检查（Prometheus 采集 + 健康探活）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.demetrius.tribunal.order: debug
